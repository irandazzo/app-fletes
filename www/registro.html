<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FletArg - Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-app">

    <header>
        FletArg - Registro
    </header>

    <main class="main-fletero">
        <h2 id="titulo-registro">Elegí tu tipo de cuenta</h2>

        <!-- Selector Inicial de Rol -->
        <div id="seleccion-perfil" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <button type="button" class="btn-principal" style="background-color: #0066cc;" onclick="mostrarFormulario('cliente')">👤 Soy Cliente (Necesito un flete)</button>
            <button type="button" class="btn-principal" style="background-color: #2b3a4a;" onclick="mostrarFormulario('proveedor')">🚚 Soy Proveedor (Tengo vehículo)</button>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #666; font-size: 14px; text-decoration: none;">← Volver al Login</a>
            </div>
        </div>

        <!-- Formulario Único de Registro -->
        <form id="form-registro" style="display: none;">
            <input type="hidden" id="rol-elegido" value="">

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" autocomplete="given-name" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" autocomplete="family-name" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="contrasena-reg">Contraseña</label>
                <input type="password" id="contrasena-reg" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
            </div>

            <!-- Campos Extra si es Proveedor -->
            <div id="campos-proveedor" style="display: none; border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 15px;">
                <h4 style="margin-bottom: 12px; font-size: 15px; color: #333;">Tarifas Base Iniciales</h4>
                
                <div class="form-group">
                    <label for="precio-piso">Valor por piso por escalera ($)</label>
                    <input type="number" id="precio-piso" min="0" value="3000">
                </div>

                <div class="form-group">
                    <label for="ofrece-peon">¿Ofrecés servicio de peón/ayudante?</label>
                    <select id="ofrece-peon" class="select-estilo" onchange="togglePrecioPeon(this)">
                        <option value="si">Sí</option>
                        <option value="no" selected>No</option>
                    </select>
                </div>

                <div class="form-group" id="contenedor-precio-peon" style="display: none;">
                    <label for="precio-peon">Valor por cada peón ($)</label>
                    <input type="number" id="precio-peon" min="0" value="8000">
                </div>

                <div class="form-group">
                    <label for="acepta-negociar">¿Aceptas negociar precio?</label>
                    <select id="acepta-negociar" class="select-estilo">
                        <option value="si" selected>Sí</option>
                        <option value="no">No</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="btn-secundario" style="flex: 1;" onclick="volverSeleccion()">Atrás</button>
                <button type="submit" class="btn-principal" style="flex: 2; background-color: #4CAF50;">Registrarse</button>
            </div>
        </form>
    </main>

    <!-- SDKs de Firebase por CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="main.js"></script>
</body>
</html>
