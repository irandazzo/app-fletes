<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FletArg - Mis Viajes (Proveedor)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-app">

    <header>
        FletArg - Panel Proveedor
    </header>

    <main class="main-fletero">
        <!-- Panel de Estadísticas y Ganancias del Proveedor -->
        <div class="tarjeta-viaje" style="background: linear-gradient(135deg, #2b3a4a, #1a2530); color: white; margin-bottom: 20px;">
            <h3 style="margin-bottom: 15px; font-size: 16px; color: #e6f0fa;">📊 Tu Rendimiento</h3>
            <div style="display: flex; justify-content: space-around; text-align: center;">
                <div>
                    <h4 id="stat-ganancias" style="font-size: 20px; color: #28a745; margin-bottom: 4px;">$ 0</h4>
                    <small style="color: #bbb; font-size: 11px;">Ganancias Totales</small>
                </div>
                <div>
                    <h4 id="stat-viajes" style="font-size: 20px; color: #4da6ff; margin-bottom: 4px;">0</h4>
                    <small style="color: #bbb; font-size: 11px;">Viajes Exitosos</small>
                </div>
                <div>
                    <h4 id="stat-calificacion" style="font-size: 20px; color: #ffc107; margin-bottom: 4px;">⭐ -</h4>
                    <small style="color: #bbb; font-size: 11px;">Promedio</small>
                </div>
            </div>
        </div>
        <!-- Pestañas (Tabs) de navegación interna con IDs para los contadores -->
        <div class="pestanas-container">
            <button id="btn-tab-pendientes" class="pestana-btn activa" onclick="cambiarPestana('pendientes')">Pendientes (0)</button>
            <button id="btn-tab-aceptados" class="pestana-btn" onclick="cambiarPestana('aceptados')">Aceptados (0)</button>
            <button id="btn-tab-completados" class="pestana-btn" onclick="cambiarPestana('completados')">Completados (0)</button>
        </div>

        <!-- SECCIÓN 1: PENDIENTES -->
        <div id="seccion-pendientes" class="seccion-tab">
            <h3 class="titulo-seccion">Viajes ofertados (Esperando tu decisión)</h3>
            <!-- Contenedor dinámico donde JS dibujará los viajes -->
            <div id="lista-viajes-pendientes">
                <!-- Acá se cargarán los viajes creados por los clientes -->
            </div>
            
        </div>

        <!-- SECCIÓN 2: ACEPTADOS -->
        <div id="seccion-aceptados" class="seccion-tab" style="display: none;">
            <h3 class="titulo-seccion">Viajes en curso / En camino</h3>
            
            <!-- Contenedor dinámico donde JS dibujará los viajes aceptados -->
            <div id="lista-viajes-aceptados">
                <!-- Acá se cargarán los viajes aceptados -->
            </div>
        </div>

        <!-- SECCIÓN 3: COMPLETADOS -->
        <div id="seccion-completados" class="seccion-tab" style="display: none;">
            <h3 class="titulo-seccion">Historial de viajes realizados</h3>
            
            <!-- Contenedor dinámico donde JS dibujará los viajes completados -->
            <div id="lista-viajes-completados">
                <!-- Acá se cargarán los viajes finalizados -->
            </div>
        </div>
            
        </div>

    </main>

    <!-- Barra Inferior -->
    <nav class="bottom-nav">
        <a href="proveedor.html" style="text-decoration: none;" class="nav-item">
            <span class="icono">📋</span>
            <span>Ofertas</span>
        </a>
        <div class="nav-item activo">
            <span class="icono">📊</span>
            <span>Mis Viajes</span>
        </div>
        <div class="nav-item">
            <a href="perfil.html" style="text-decoration: none;" class="nav-item">
            <span class="icono">👤</span>
            <span>Perfil</span>
</a>
        </div>
    </nav>

    <script src="main.js"></script>
</body>
</html>
