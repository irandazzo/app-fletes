<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FletArg - Mis Fletes (Cliente)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-app">

    <header>
        FletArg - Mis Fletes
    </header>

    <main class="main-fletero">
        <!-- Pestañas (Tabs) de navegación interna para el Cliente -->
        <div class="pestanas-container">
            <button id="btn-cliente-pendientes" class="pestana-btn activa" onclick="cambiarPestanaCliente('pendientes')">Buscando (0)</button>
            <button id="btn-cliente-en-curso" class="pestana-btn" onclick="cambiarPestanaCliente('en-curso')">En Camino (0)</button>
            <button id="btn-cliente-historial" class="pestana-btn" onclick="cambiarPestanaCliente('historial')">Historial (0)</button>
        </div>

        <!-- SECCIÓN 1: BUSCANDO / PENDIENTES -->
        <div id="seccion-cliente-pendientes" class="seccion-tab">
            <h3 class="titulo-seccion">Fletes publicados (Esperando proveedor)</h3>
            <div id="lista-cliente-pendientes"></div>
        </div>

        <!-- SECCIÓN 2: EN CURSO / ACEPTADOS -->
        <div id="seccion-cliente-en-curso" class="seccion-tab" style="display: none;">
            <h3 class="titulo-seccion">Viajes aceptados por un proveedor</h3>
            <div id="lista-cliente-en-curso"></div>
        </div>

        <!-- SECCIÓN 3: HISTORIAL / COMPLETADOS -->
        <div id="seccion-cliente-historial" class="seccion-tab" style="display: none;">
            <h3 class="titulo-seccion">Tus fletes finalizados</h3>
            <div id="lista-cliente-historial"></div>
        </div>
    </main>

    <!-- Barra de Navegación Inferior -->
    <nav class="bottom-nav">
        <a href="cliente.html" style="text-decoration: none;" class="nav-item">
            <span class="icono">🏠</span>
            <span>Inicio</span>
        </a>
        <a href="cliente-viajes.html" style="text-decoration: none;" class="nav-item activo">
            <span class="icono">📦</span>
            <span>Mis Viajes</span>
        </a>
        <a href="perfil.html" style="text-decoration: none;" class="nav-item">
            <span class="icono">👤</span>
            <span>Perfil</span>
        </a>
    </nav>

    <script src="main.js"></script>
</body>
</html>
