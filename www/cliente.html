<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FletArg - Solicitar Flete</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-cliente">

    <header>
        FletArg - Pedir Flete
    </header>

    <main class="main-cliente">
        <div class="panel-pedido">
            <h3>¿Qué necesitás trasladar hoy?</h3>

            <!-- 1. Selección de Vehículo -->
            <div class="seleccion-vehiculo">
                <h4>1. Elegí el vehículo:</h4>
                <div class="opciones-vehiculo">
                    <div class="opcion-card activa" data-vehiculo="Moto">
                        <span class="icono-vehiculo">🏍️</span>
                        <span class="nombre-vehiculo">Moto</span>
                    </div>
                    <div class="opcion-card" data-vehiculo="Utilitario">
                        <span class="icono-vehiculo">🚐</span>
                        <span class="nombre-vehiculo">Utilitario</span>
                    </div>
                    <div class="opcion-card" data-vehiculo="Pickup">
                        <span class="icono-vehiculo">🛻</span>
                        <span class="nombre-vehiculo">Pickup</span>
                    </div>
                    <div class="opcion-card" data-vehiculo="Camión">
                        <span class="icono-vehiculo">🚚</span>
                        <span class="nombre-vehiculo">Camión</span>
                    </div>
                </div>
            </div>

            <!-- 2. Direcciones -->
            <div class="seccion-extra">
                <h4>2. Recorrido:</h4>
                <div class="form-group">
                    <label for="origen">Dirección de Origen:</label>
                    <input type="text" id="origen" placeholder="Ej: Av. Corrientes 1234, CABA" autocomplete="off">
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="destino">Dirección de Destino:</label>
                    <input type="text" id="destino" placeholder="Ej: Av. Rivadavia 5678, CABA" autocomplete="off">
                </div>
            </div>

            <!-- 3. Cuándo lo necesita -->
            <div class="seccion-extra">
                <h4>3. ¿Cuándo lo necesitás?</h4>
                <input type="hidden" id="tipo-viaje-seleccion" value="inmediato">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button type="button" class="btn-principal btn-opcion-cuando activo" data-valor="inmediato" style="background: transparent; color: #2b3a4a; border: 1px solid #ccc; font-size: 14px; padding: 10px;">⚡ Lo antes posible</button>
                    <button type="button" class="btn-principal btn-opcion-cuando" data-valor="programado" style="background: transparent; color: #2b3a4a; border: 1px solid #ccc; font-size: 14px; padding: 10px;">📅 Programar fecha</button>
                </div>
                
                <div id="contenedor-fecha" style="display: none; margin-top: 10px;">
                    <label for="fecha-programada" style="font-size: 13px; color: #555; margin-bottom: 5px;">Fecha y hora del servicio:</label>
                    <input type="datetime-local" id="fecha-programada">
                    <small id="texto-fecha-elegida" style="display:none; color: #2e7d32; font-weight: bold; margin-top: 5px;"></small>
                </div>
            </div>

            <!-- 4. Servicios Adicionales -->
            <div class="seccion-extra">
                <h4>4. Servicios adicionales (Opcional):</h4>
                
                <!-- Peón -->
                <div class="grupo-check">
                    <label class="check-item">
                        <span class="check-texto">👷 Necesito peón/ayudante</span>
                        <input type="checkbox" id="peon">
                    </label>
                    <div id="peon-cantidad-container" class="sub-opcion">
                        <span style="font-size: 14px; color: #555;">Cantidad de ayudantes:</span>
                        <input type="number" id="cantidad-peones" class="input-chico" value="1" min="1" max="5">
                    </div>
                </div>

                <!-- Escalera -->
                <div class="grupo-check">
                    <label class="check-item">
                        <span class="check-texto">🪜 Subir por escalera (Pisos)</span>
                        <input type="checkbox" id="escalera">
                    </label>
                    <div id="escalera-pisos-container" class="sub-opcion">
                        <span style="font-size: 14px; color: #555;">Cantidad de pisos:</span>
                        <input type="number" id="cantidad-pisos" class="input-chico" value="1" min="1" max="20">
                    </div>
                </div>
            </div>

            <!-- 5. Detalles y Pago -->
            <div class="seccion-extra">
                <div class="form-group">
                    <label for="detalle-carga">Detalles de la carga:</label>
                    <textarea id="detalle-carga" class="input-full" rows="2" placeholder="Ej: Una heladera, dos cajas..."></textarea>
                </div>

                <div class="form-group">
                    <label for="metodo-pago">Método de pago:</label>
                    <select id="metodo-pago" class="select-estilo">
                        <option value="efectivo">Efectivo al finalizar</option>
                        <option value="transferencia">Transferencia Bancaria</option>
                    </select>
                </div>
            </div>

            <!-- Botón Cotizar -->
            <button type="button" class="btn-principal" style="background-color: #4CAF50; margin-top: 10px;">Cotizar y Publicar Flete</button>
        </div>
    </main>

    <!-- Modal de Confirmación de Flete -->
    <div id="modal-confirmacion" class="modal-overlay oculto">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; color: #2b3a4a;">📦 Resumen del Pedido</h3>
            <div id="modal-detalles" style="text-align: left; font-size: 14px; color: #444; margin-bottom: 20px; line-height: 1.6;">
                <!-- Se llena por JS -->
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" id="btn-cancelar-modal" class="btn-secundario" style="padding: 12px; font-size: 14px;">Cancelar</button>
                <button type="button" id="btn-confirmar-viaje" class="btn-principal" style="padding: 12px; font-size: 14px; background-color: #4CAF50;">Confirmar Flete</button>
            </div>
        </div>
    </div>

    <!-- Navegación Inferior -->
    <nav class="bottom-nav">
        <a href="cliente.html" class="nav-item activo"><span class="icono">🏠</span><span>Inicio</span></a>
        <a href="cliente-viajes.html" class="nav-item"><span class="icono">📦</span><span>Mis Viajes</span></a>
        <a href="perfil.html" class="nav-item"><span class="icono">👤</span><span>Perfil</span></a>
    </nav>

    <!-- SDKs de Firebase por CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="main.js"></script>
</body>
</html>
