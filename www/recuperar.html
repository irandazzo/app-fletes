<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FletArg - Recuperar Contraseña</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-app">

    <header>
        FletArg - Recuperar Acceso
    </header>

    <main>
        <h2 style="margin-bottom: 10px;">Restablecer contraseña</h2>
        <p style="color: #666; font-size: 14px; text-align: center; margin-bottom: 25px; line-height: 1.4;">
            Ingresá tu correo electrónico registrado y te enviaremos un enlace oficial de Firebase para que puedas crear una nueva contraseña.
        </p>

        <!-- Formulario de Recupero conectado a la función global en main.js -->
        <form id="form-recupero" onsubmit="enviarCodigoRecuperoPagina(event)">
            <div class="form-group">
                <label for="email-recupero">Correo electrónico</label>
                <input type="email" id="email-recupero" autocomplete="email" placeholder="tucorreo@email.com" required>
            </div>

            <button type="submit" class="btn-principal" style="background-color: #0066cc; margin-bottom: 15px;">Enviar enlace de recuperación</button>
            
            <div style="text-align: center;">
                <a href="index.html" style="color: #666; font-size: 14px; text-decoration: none; font-weight: 600;">← Volver al Login</a>
            </div>
        </form>
    </main>

    <!-- SDKs de Firebase por CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="main.js"></script>
</body>
</html>
