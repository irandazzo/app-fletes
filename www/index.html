<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FletArg - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        FletArg
    </header>

    <main>
        <h2>Iniciar Sesión</h2>
        
        <form id="form-login">
            <div class="form-group">
                <label for="usuario">Usuario o Email:</label>
                <input type="text" id="usuario" name="usuario" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="********" required>
            </div>

            <div class="enlace-olvido">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-principal">Ingresar</button>
        </form>

        <div class="registro-section">
            <p>¿No tenés una cuenta en FletArg?</p>
            <a href="registro.html" style="text-decoration: none;">
                <button type="button" class="btn-secundario">Registrarse</button>
            </a>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
