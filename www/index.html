<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FletArg - Ingreso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-app">

    <header>
        FletArg
    </header>

    <main>
        <!-- Formulario de Login -->
        <h2 id="titulo-login">Iniciar Sesión</h2>
        
        <form id="form-login">
            <div class="form-group">
                <label for="usuario">Correo electrónico</label>
                <input type="email" id="usuario" name="usuario" autocomplete="email" placeholder="tucorreo@email.com" required>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="********" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-principal">Ingresar</button>
        </form>

        <div class="enlace-olvido" style="margin-top: 15px;">
            <a href="recupero.html">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Sección para ir al Registro -->
        <div class="registro-section">
            <p>¿No tenés cuenta todavía?</p>
            <button type="button" class="btn-secundario" onclick="window.location.href='registro.html'">Crear Cuenta</button>
        </div>
    </main>

    <!-- SDKs de Firebase por CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="main.js"></script>
</body>
</html>
